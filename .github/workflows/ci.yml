# Integración continua: se ejecuta en cada push y en cada pull request.
# Si el estilo (flake8) o alguna prueba (pytest) falla, el commit queda en rojo
# y la regla de protección de main impide fusionar el pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  #se agrega el job de estilo 
 estilo:
    name: Estilo PEP 8 (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install flake8
      - run: flake8 src tests

    #Se edita archivo de pruebas, de agrega el uso de docker 
 pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          #trabajaremos con versionamiento en este caso, isntalando las dependencias necesarias 
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Pruebas unitarias con cobertura
        run: pytest --cov=cromantic_scraper --cov-report=term-missing --cov-fail-under=75

    #se invoca el docker para contenedor 
 docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen (con caché de capas)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cromantic-precios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar el contenedor con datos de ejemplo
        run: |
          docker run -d --name app -p 10000:10000 \
            -v "$PWD/tests/fixtures/productos_ejemplo.csv:/datos/productos.csv:ro" \
            -e DATA_PATH=/datos/productos.csv \
            cromantic-precios:ci
      - name: Verificar /health dentro del contenedor
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:10000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
